app:
  name: PrivacyLens
  version: 0.1.0
  env: development
server:
  host: 127.0.0.1
  port: 8000
browser:
  browser_channel: chromium
tesseract:
  tesseract_cmd: C:\Program Files\Tesseract-OCR\tesseract.exe
detectors:
  enabled:
  - pattern
  - structural
  - presidio
  - vision
  presidio_score_threshold: 0.4
llm:
  provider: gemini
  model: gemini-3.5-flash
  temperature: 0.0
  api_key_envs:
    - GEMINI_API_KEY
    - GEMINI_API_KEY_2
    - GEMINI_API_KEY_3
  fallback_models:
    - gemini-2.5-flash
    - gemini-2.5-flash-lite
    - gemini-1.5-flash
    - gemini-1.5-pro
  max_calls_per_run: 14
  rpm_limit: 4
  budget_file: logs/llm_budget.json
audit:
  log_path: logs/audit.jsonl
policy:
  policy_path: privacylens/policy/default_policy.yaml
  profile: default
egress:
  allowed_hosts:
  - generativelanguage.googleapis.com
  - 127.0.0.1
  - localhost
  on_image_check_failure: block
agent:
  allowed_hosts:
  - 127.0.0.1
  - localhost
secrets:
  allowed_origins:
  - http://127.0.0.1:8765
