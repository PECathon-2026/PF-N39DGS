custom_rules: []

approval_required:
  actions:
    - type: "click"
      selectors:
        - "*[id*='pay' i]"
        - "*[id*='delete' i]"
        - "*[id*='submit' i]"
        - "*[id*='order' i]"
        - "button[type='submit']"
      reason: "High-impact financial or irreversible user transaction"
    - type: "fill"
      selectors:
        - "input[type='password']"
      reason: "Credential entry requires manual user authorization"
