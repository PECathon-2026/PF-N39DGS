version: "1.0"

entities:
  CARD:
    action: "mask"
    description: "Payment card numbers (Luhn valid 13-19 digits)"
  CARD_MASKED:
    action: "allow"
    description: "Masked card visual placeholder"
  AADHAAR:
    action: "mask"
    description: "Indian national identity 12-digit number (Verhoeff valid)"
  PAN:
    action: "mask"
    description: "Indian Permanent Account Number (Income Tax)"
  PASSWORD:
    action: "block"
    description: "Authentication passwords and credentials"
  OTP:
    action: "block"
    description: "One-time passwords and verification codes"
  CVV:
    action: "mask"
    description: "Card verification value / security code"
  EXPIRY:
    action: "mask"
    description: "Card expiration date"
  EMAIL:
    action: "mask"
    description: "Personal and corporate email addresses"
  PHONE:
    action: "mask"
    description: "International and domestic phone numbers"
  NAME:
    action: "mask"
    description: "Person full names"
  ADDRESS:
    action: "mask"
    description: "Physical street and delivery addresses"
  API_KEY:
    action: "block"
    description: "Cloud and service API secret tokens"
  JWT:
    action: "block"
    description: "JSON Web Tokens and signed authorization tokens"
  TOKEN:
    action: "block"
    description: "Session tokens and authentication tokens"
  IP:
    action: "mask"
    description: "IPv4 and IPv6 network addresses"
  FACE:
    action: "mask"
    description: "Human facial imagery in screen captures"
  NOTE_WITH_CANARY:
    action: "mask"
    description: "Sensitive notes containing canary tokens"

custom_rules: []

approval_required:
  actions:
    - type: "click"
      selectors:
        - "*[id*='pay' i]"
        - "*[id*='delete' i]"
        - "*[id*='submit' i]"
        - "*[id*='order' i]"
        - "button[type='submit']"
      reason: "High-impact financial or irreversible user transaction"
    - type: "fill"
      selectors:
        - "input[type='password']"
      reason: "Credential entry requires manual user authorization"
