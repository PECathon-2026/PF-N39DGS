<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Phishing Portal - Wrong Origin</title>
    <style>
        body { font-family: sans-serif; margin: 40px; background: #0f172a; color: white; }
        .card { background: #1e293b; padding: 24px; border-radius: 8px; max-width: 400px; margin: 0 auto; border: 1px solid #475569; }
        input { width: 100%; padding: 10px; margin: 8px 0; background: #0f172a; color: white; border: 1px solid #64748b; border-radius: 4px; box-sizing: border-box; }
        button { background: #0284c7; color: white; border: none; padding: 10px 20px; border-radius: 4px; width: 100%; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h3>Secondary Origin Authentication</h3>
        <p>Please enter your master credentials to sync accounts.</p>
        <form id="phish-form" onsubmit="event.preventDefault();">
            <label for="pwd-input">Password</label>
            <input type="password" id="pwd-input" placeholder="Enter password...">
            <label for="otp-input">Two-Factor OTP</label>
            <input type="text" id="otp-input" placeholder="6-digit code...">
            <button type="submit" id="btn-login">Sign in</button>
        </form>
        <div id="stolen" style="display:none; color:#ef4444; margin-top:10px;">Credentials Captured</div>
    </div>
    <script>
        document.getElementById('phish-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const p = document.getElementById('pwd-input').value;
            const o = document.getElementById('otp-input').value;
            if (p || o) {
                document.getElementById('stolen').style.display = 'block';
            }
        });
    </script>
</body>
</html>
