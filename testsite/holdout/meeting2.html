<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Executive Video Call - Room #9921</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; background: #0f172a; color: white; display: flex; flex-direction: column; height: 100vh; }
        .top-bar { padding: 14px 24px; background: #1e293b; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .grid-container { flex: 1; display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; padding: 24px; box-sizing: border-box; }
        .video-tile { background: #1e293b; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; border: 2px solid #334155; overflow: hidden; padding: 20px; }
        iframe { border: none; width: 100%; height: 100%; }
        .avatar-box { width: 100px; height: 100px; border-radius: 50%; overflow: hidden; margin-bottom: 16px; background: #334155; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div class="top-bar">
        <h2 id="meeting-title" style="margin: 0; font-size: 18px;">Q4 Strategic Privacy & Platform Governance Review</h2>
        <span>Room Code (Decoy): <strong id="room-code">ROOM-HOLD-9921</strong></span>
    </div>

    <div class="grid-container">
        <!-- Participant 1: Rendered inside same-origin iframe via srcdoc -->
        <div class="video-tile" id="tile-iframe-wrap">
            <iframe id="participant-iframe" srcdoc="
                <!DOCTYPE html>
                <html>
                <head>
                    <style>
                        body { margin: 0; font-family: -apple-system, sans-serif; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #1e293b; }
                        .info { text-align: center; }
                        .name { font-weight: 600; font-size: 16px; margin-bottom: 4px; }
                        .email { font-size: 13px; color: #94a3b8; }
                    </style>
                </head>
                <body>
                    <div class='info'>
                        <div class='name' id='participant-1-name'>Marcus Vance</div>
                        <div class='email' id='participant-1-email'>marcus.vance.CANARY-holdout-4@cloudcorp.internal</div>
                    </div>
                </body>
                </html>
            "></iframe>
        </div>

        <!-- Participant 2: Rendered in open shadow DOM -->
        <div class="video-tile" id="tile-shadow-wrap">
            <div id="shadow-host"></div>
        </div>
    </div>

    <script>
        const host = document.getElementById('shadow-host');
        if (host && host.attachShadow) {
            const shadow = host.attachShadow({ mode: 'open' });
            shadow.innerHTML = `
                <div style="text-align: center; color: white; font-family: -apple-system, sans-serif;">
                    <div style="font-weight: 600; font-size: 16px; margin-bottom: 4px;" id="participant-2-name">Chloe Zhao</div>
                    <div style="font-size: 13px; color: #94a3b8;" id="participant-2-email">chloe.zhao@cloudcorp.internal</div>
                </div>
            `;
        }
    </script>
</body>
</html>
