<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checkout - SwiftGear Store</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 40px; background: #f8fafc; color: #1e293b; }
        .container { max-width: 650px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        h1 { margin-top: 0; color: #0f172a; border-bottom: 2px solid #e2e8f0; padding-bottom: 12px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        .row { display: flex; gap: 16px; }
        .row > div { flex: 1; }
        .order-summary { background: #f1f5f9; padding: 16px; border-radius: 6px; margin: 24px 0; }
        .order-summary h3 { margin-top: 0; margin-bottom: 8px; }
        .btn-submit { background: #2563eb; color: white; border: none; padding: 14px 24px; font-size: 16px; font-weight: 600; border-radius: 6px; cursor: pointer; width: 100%; }
        .btn-submit:hover { background: #1d4ed8; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 500; background: #e0f2fe; color: #0369a1; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Secure Checkout</h1>
        <div class="order-summary">
            <h3>Order Overview <span class="badge">Decoy Protected</span></h3>
            <p><strong>Order Reference (Decoy 12-digit):</strong> <span id="order-id">987654321013</span></p>
            <p><strong>Shipping Tracking (Decoy 16-digit):</strong> <span id="tracking-number">9999888877776660</span></p>
            <p><strong>Total Amount:</strong> $149.99</p>
        </div>

        <form id="checkout-form" onsubmit="event.preventDefault();">
            <h3>Shipping Details</h3>
            <div class="form-group">
                <label for="customer-name">Full Name</label>
                <input type="text" id="customer-name" name="customer_name" value="Alex Rivera" required>
            </div>
            <div class="form-group">
                <label for="shipping-address">Street Address</label>
                <input type="text" id="shipping-address" name="shipping_address" value="742 Evergreen Terrace, Suite CANARY-a1b2c3d4, Springfield, OR 97477" required>
            </div>
            <div class="form-group">
                <label for="phone-number">Phone Number</label>
                <input type="tel" id="phone-number" name="phone_number" value="+1-555-839-2041" required>
            </div>

            <h3>Payment Information</h3>
            <div class="form-group">
                <label for="card-number">Card Number (Visa)</label>
                <input type="text" id="card-number" name="card_number" value="4676336067708530" required>
            </div>
            <div class="row">
                <div class="form-group">
                    <label for="card-expiry">Expiration (MM/YY)</label>
                    <input type="text" id="card-expiry" name="card_expiry" value="08/28" placeholder="MM/YY" required>
                </div>
                <div class="form-group">
                    <label for="card-cvv">Security Code (CVV)</label>
                    <input type="password" id="card-cvv" name="card_cvv" value="842" maxlength="4" required>
                </div>
            </div>

            <button type="submit" id="btn-place-order" class="btn-submit">Place Order</button>
        </form>
    </div>
</body>
</html>
