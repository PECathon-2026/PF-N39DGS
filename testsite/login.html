<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Enterprise Portal Login</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 60px auto; background: #0f172a; color: #f8fafc; }
        .login-card { max-width: 420px; margin: 0 auto; background: #1e293b; padding: 36px; border-radius: 10px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4); border: 1px solid #334155; }
        h2 { margin-top: 0; text-align: center; color: #38bdf8; }
        p.subtitle { text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: 500; margin-bottom: 6px; font-size: 13px; color: #cbd5e1; }
        input { width: 100%; padding: 11px; background: #0f172a; border: 1px solid #475569; border-radius: 6px; color: #f8fafc; box-sizing: border-box; font-size: 14px; }
        input:focus { outline: none; border-color: #38bdf8; }
        .btn-signin { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 15px; margin-top: 8px; }
        .btn-signin:hover { background: #0369a1; }
        .footer-links { margin-top: 20px; display: flex; justify-content: space-between; font-size: 13px; }
        .footer-links a { color: #38bdf8; text-decoration: none; }
        .footer-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Corporate Auth</h2>
        <p class="subtitle">Multi-Factor Authenticated Access Portal</p>
        <form id="login-form" onsubmit="event.preventDefault();">
            <div class="form-group">
                <label for="email-input">Work Email Address</label>
                <input type="email" id="email-input" name="email" value="user.CANARY-e5f6a7b8@privacylens.test" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="password-input">Master Password</label>
                <input type="password" id="password-input" name="password" value="VaultPass#9821!" autocomplete="current-password" required>
            </div>
            <div class="form-group">
                <label for="otp-input">Authenticator One-Time Code (OTP)</label>
                <input type="text" id="otp-input" name="otp" value="738291" maxlength="6" inputmode="numeric" required>
            </div>
            <button type="submit" id="btn-signin" class="btn-signin">Sign in</button>
            <div id="welcome" style="display:none; margin-top:15px; color:#1b5e20; font-weight:bold;">Welcome back, authenticated user!</div>
            <div class="footer-links">
                <a href="#reset" id="link-forgot-password">Forgot password?</a>
                <a href="#help" id="link-support-help">Security Support</a>
            </div>
        </form>
    </div>
    <script>
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            document.getElementById('welcome').style.display = 'block';
        });
        document.getElementById('btn-signin').addEventListener('click', function(e) {
            e.preventDefault();
            document.getElementById('welcome').style.display = 'block';
        });
    </script>
</body>
</html>
