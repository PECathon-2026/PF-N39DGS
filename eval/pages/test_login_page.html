<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PrivacyLens Test Login Portal</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 2.5rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 360px; border: 1px solid #334155; }
    h2 { margin-top: 0; margin-bottom: 1.5rem; text-align: center; color: #38bdf8; }
    .form-group { margin-bottom: 1.2rem; }
    label { display: block; margin-bottom: 0.4rem; font-size: 0.9rem; color: #94a3b8; }
    input[type="email"], input[type="text"], input[type="password"] { width: 100%; box-sizing: border-box; padding: 0.75rem; background: #0f172a; border: 1px solid #475569; border-radius: 6px; color: #fff; font-size: 1rem; }
    input:focus { outline: none; border-color: #38bdf8; }
    .pwd-wrapper { position: relative; }
    .toggle-btn { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: transparent; border: none; color: #94a3b8; cursor: pointer; font-size: 0.8rem; }
    .btn-submit { width: 100%; padding: 0.8rem; background: #0284c7; color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 1rem; transition: background 0.2s; }
    .btn-submit:hover { background: #0369a1; }
    .success-banner { display: none; margin-top: 1rem; padding: 0.8rem; background: #064e3b; color: #6ee7b7; border-radius: 6px; text-align: center; font-size: 0.95rem; font-weight: 500; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Secure Login</h2>
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="email">Account Email</label>
        <input type="email" id="email" name="username" placeholder="user@example.com" autocomplete="email" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <div class="pwd-wrapper">
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
          <button type="button" class="toggle-btn" onclick="togglePassword()">Show</button>
        </div>
      </div>
      <button type="submit" id="btn-login" class="btn-submit">Sign In</button>
      <div id="successMsg" class="success-banner">Login Successful! Identity verified locally.</div>
    </form>
  </div>

  <script>
    function togglePassword() {
      const pwd = document.getElementById('password');
      const btn = event.target;
      if (pwd.type === 'password') {
        pwd.type = 'text';
        btn.innerText = 'Hide';
      } else {
        pwd.type = 'password';
        btn.innerText = 'Show';
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      document.getElementById('successMsg').style.display = 'block';
    }
  </script>
</body>
</html>
